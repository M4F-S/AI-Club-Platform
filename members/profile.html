<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — 42 Berlin AI Club</title>
    <link rel="stylesheet" href="/assets/new-design-system.css?v=15">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#060612">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  
  
  
  
  
</head>
<body>
  <header class="member-header">
    <div class="container member-header-inner">
      <a href="/members/index.html" class="logo" aria-label="Dashboard">
        <img src="/assets/logo-gate.png" alt="42 Berlin AI Club" style="height:32px;width:auto;border-radius:8px;">
        <span style="margin-left:10px;font-family:var(--font-d);font-size:18px;letter-spacing:-.02em;color:var(--text)">42 Berlin AI Club</span>
      </a>
      <div class="user-menu">
        <span class="user-name" id="user-name">Loading...</span>
        <button class="logout-btn" id="logout-btn">Log out</button>
      </div>
    </div>
  </header>

<div class="container member-layout">
    <nav class="member-nav"></nav>
    <main class="member-main">

      <h1 class="page-title animate-on-scroll">Your Profile</h1>
      <p class="page-subtitle animate-on-scroll">Manage your account and password.</p>

      <div class="card animate-on-scroll stagger-1">
        <h2>Account details</h2>
        <p><strong>Name:</strong> <span id="profile-name">Loading...</span></p>
        <p><strong>Email:</strong> <span id="profile-email">Loading...</span></p>
        <p><strong>Role:</strong> <span id="profile-role">Loading...</span></p>
      </div>

      <div class="card animate-on-scroll stagger-2">
        <h2>Change password</h2>
        <div class="alert" id="pwd-alert"></div>
        <form id="change-password-form">
          <div class="form-group">
            <label for="current">Current password</label>
            <input type="password" id="current" name="current_password" required>
          </div>
          <div class="form-group">
            <label for="new">New password</label>
            <input type="password" id="new" name="new_password" minlength="8" required>
          </div>
          <button type="submit" class="btn btn-primary">Update password</button>
        </form>
      </div>

      <script>
document.addEventListener("DOMContentLoaded", async () => {

          (async () => {
            const { api } = window.MemberAPI;
            const res = await api('/member/me');
            if (res.ok) {
              const u = res.data.user;
              document.getElementById('profile-name').textContent = u.name;
              document.getElementById('profile-email').textContent = u.email;
              document.getElementById('profile-role').textContent = u.role;
            }
          })();

          document.getElementById('change-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alert = document.getElementById('pwd-alert');
            const { api } = window.MemberAPI;
            const res = await api('/member/change-password', {
              method: 'POST',
              body: JSON.stringify({
                current_password: e.target.current_password.value,
                new_password: e.target.new_password.value
              })
            });
            alert.className = 'alert show ' + (res.ok ? 'success' : 'error');
            alert.textContent = res.ok ? 'Password updated successfully.' : (res.data.error || 'Failed to update password.');
            if (res.ok) e.target.reset();
          });
      
});
</script>
    </main>
</div>


<button id="orb" class="orb" aria-label="Open Synapse AI agent" onclick="toggle()">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.5"/><path d="M12 8v4"/><path d="M12 14h.01"/><circle cx="12" cy="17" r="2.5"/><circle cx="5" cy="12" r="2.5"/><circle cx="19" cy="12" r="2.5"/></svg>
</button>
<div id="agent-panel" role="dialog" aria-label="Synapse AI chat">
  <div class="ap-head">
    <span class="ap-name"><span class="dot"></span> Synapse AI</span>
    <button class="ap-close" onclick="toggle()" aria-label="Close">&times;</button>
  </div>
  <div class="ap-body" id="agent-messages">
    <div class="ap-msg agent">Hi, I am Synapse — the club's AI assistant. Ask me anything about workshops, events, membership, or the community.</div>
  </div>
  <form class="ap-inp" id="agent-form" onsubmit="return ask(event)">
    <input type="text" id="agent-input" placeholder="Ask Synapse anything…" autocomplete="off">
    <button type="submit" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
  </form>
</div>
<script src="/assets/site.js?v=1"></script>
<script src="https://unpkg.com/lucide@latest"></script>
    <script src="/members/members.js?v=3"></script>

</body>
</html>
