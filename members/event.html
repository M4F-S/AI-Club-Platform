  <style>
    .slide-viewer { margin: 24px 0; }
    .slide-main {
      position: relative;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 220px;
    }
    .slide-main img {
      max-width: 100%;
      height: auto;
      max-height: 70vh;
      object-fit: contain;
      display: block;
    }
    .slide-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: rgba(6,6,18,.8);
      color: var(--text);
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all .2s;
      z-index: 2;
    }
    .slide-nav:hover { border-color: var(--mint); color: var(--mint); }
    .slide-nav.prev { left: 12px; }
    .slide-nav.next { right: 12px; }
    .slide-counter {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(6,6,18,.8);
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 12px;
      letter-spacing: .1em;
      z-index: 2;
    }
    .slide-fullscreen {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: rgba(6,6,18,.8);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 2;
    }
    .slide-thumbnails {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      margin-top: 14px;
      padding-bottom: 4px;
    }
    .slide-thumb {
      flex: 0 0 80px;
      height: 54px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--line);
      cursor: pointer;
      opacity: .7;
      transition: all .2s;
    }
    .slide-thumb.active { opacity: 1; border-color: var(--mint); }
    .slide-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .materials-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-top: 16px; }
    .material-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px;
      transition: border-color .3s, transform .3s;
    }
    .material-card:hover { border-color: var(--mint); transform: translateY(-4px); }
    .material-icon { font-size: 28px; margin-bottom: 10px; }
    .material-card h3 { font-family: var(--font-d); font-size: 16px; margin-bottom: 6px; }
    .material-card p { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    .material-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    @media (max-width: 640px) {
      .slide-main { border-radius: 10px; min-height: 160px; }
      .slide-nav { width: 36px; height: 36px; font-size: 18px; }
      .slide-thumb { flex: 0 0 64px; height: 44px; }
      .materials-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="member-header">
    <div class="container member-header-inner">
      <a href="/members/index.html" class="logo" aria-label="Dashboard">
        <img src="/assets/logo-gate.png" alt="42 Berlin AI Club" style="height:32px;width:auto;border-radius:8px;">
        <span style="margin-left:10px;font-family:var(--font-d);font-size:18px;letter-spacing:-.02em;color:var(--text)">42 Berlin AI Club</span>
      </a>
      <div class="user-menu">
        <span class="user-name" id="user-name">Loading...</span>
        <button class="logout-btn" id="logout-btn">Log out</button>
      </div>
    </div>
  </header>

  <div class="container member-layout">
    <nav class="member-nav"></nav>
    <main class="member-main">
      <div id="event-container"><p class="loading-text">Loading workshop...</p></div>
    </main>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/members/members.js?v=3"></script>
  <script>
  (function() {
    function escapeHtml(t) {
      if (t == null) return '';
      const d = document.createElement('div');
      d.textContent = t;
      return d.innerHTML;
    }

    async function loadEvent() {
      const container = document.getElementById('event-container');
      if (!window.MemberAPI) {
        container.innerHTML = '<div class="card"><p style="color:#e74c3c">Error: MemberAPI not loaded. Please refresh.</p></div>';
        return;
      }

      const { api } = window.MemberAPI;
      const params = new URLSearchParams(window.location.search);
      const eventId = params.get('id');
      if (!eventId) {
        container.innerHTML = '<div class="card"><p>No event selected.</p><a href="events.html" class="btn btn-primary">Back to workshops</a></div>';
        return;
      }

      const res = await api('/events/' + eventId);
      if (!res.ok) {
        container.innerHTML = '<div class="card"><p style="color:#e74c3c">Failed to load workshop. <button onclick="location.reload()" style="background:none;border:none;color:#ff6b8a;text-decoration:underline;cursor:pointer;">Retry</button></p></div>';
        return;
      }

      const event = res.data;
      const slides = (event.materials || []).filter(m => m.file_type === 'slide' && m.is_revealed);
      const pdfs = (event.materials || []).filter(m => m.file_type === 'pdf' && m.is_revealed);
      const quizzes = (event.materials || []).filter(m => m.file_type === 'quiz' && m.is_revealed);
      const other = (event.materials || []).filter(m => !['slide','pdf','quiz'].includes(m.file_type) && m.is_revealed);
      const hasNonSlides = pdfs.length + quizzes.length + other.length > 0;

      let html = `
        <div class="animate-on-scroll">
          <a href="events.html" style="color:var(--muted);font-size:0.9rem;">← Back to workshops</a>
          <h1 class="page-title" style="margin-top:8px;">${escapeHtml(event.title)}</h1>
          <p class="page-subtitle">${event.event_date ? new Date(event.event_date).toLocaleString() + (event.location ? ' · ' + escapeHtml(event.location) : '') : 'Date TBD'}</p>
        </div>
        <div class="card animate-on-scroll"><p>${escapeHtml(event.description || '')}</p></div>
      `;

      if (slides.length > 0) {
        html += `
          <div class="slide-viewer animate-on-scroll" id="slide-viewer">
            <div class="slide-main" id="slide-main">
              <img id="slide-img" src="" alt="Slide" loading="lazy">
              <button class="slide-nav prev" id="slide-prev" aria-label="Previous slide">‹</button>
              <button class="slide-nav next" id="slide-next" aria-label="Next slide">›</button>
              <div class="slide-counter" id="slide-counter">1 / ${slides.length}</div>
              <button class="slide-fullscreen" id="slide-fullscreen" aria-label="Fullscreen">⛶</button>
            </div>
            <div class="slide-thumbnails" id="slide-thumbnails">
              ${slides.map((s, i) => `
                <div class="slide-thumb ${i === 0 ? 'active' : ''}" data-index="${i}" data-id="${s.id}">
                  <img src="/api/events/${event.id}/materials/${s.id}/view" alt="Slide ${i+1}" loading="lazy">
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      if (hasNonSlides) {
        html += `<h2 class="page-title animate-on-scroll" style="font-size: 1.5rem; margin: 32px 0 16px;">Materials</h2>`;
        html += `<div class="materials-grid animate-on-scroll">`;
        [...pdfs, ...quizzes, ...other].forEach(m => {
          const icon = m.file_type === 'pdf' ? '📄' : m.file_type === 'quiz' ? '🎯' : '📎';
          const viewUrl = `/api/events/${event.id}/materials/${m.id}/view`;
          const downloadUrl = `/api/events/${event.id}/materials/${m.id}/download`;
          let actions = '';
          if (m.file_type === 'quiz') {
            actions = `<a href="quiz-interactive.html?event=${event.id}" class="btn btn-primary">Take Quiz</a>`;
          } else {
            actions = `<a href="${viewUrl}" target="_blank" class="btn btn-secondary">View</a>`;
            actions += `<a href="${downloadUrl}" class="btn btn-primary" download style="margin-left:8px;">Download</a>`;
          }
          html += `
            <div class="material-card">
              <div class="material-icon">${icon}</div>
              <h3>${escapeHtml(m.title)}</h3>
              <p>${escapeHtml(m.description || m.file_type.toUpperCase())}</p>
              <div class="material-actions">${actions}</div>
            </div>
          `;
        });
        html += `</div>`;
      } else if (!slides.length) {
        html += `<div class="card animate-on-scroll"><p>No materials available for this workshop yet.</p></div>`;
      }

      container.innerHTML = html;

      if (slides.length > 0) {
        let currentSlide = 0;
        const slideImg = document.getElementById('slide-img');
        const counter = document.getElementById('slide-counter');
        const thumbs = document.querySelectorAll('.slide-thumb');

        function showSlide(index) {
          if (index < 0) index = slides.length - 1;
          if (index >= slides.length) index = 0;
          currentSlide = index;
          const slide = slides[index];
          slideImg.src = `/api/events/${event.id}/materials/${slide.id}/view`;
          counter.textContent = `${index + 1} / ${slides.length}`;
          thumbs.forEach((t, i) => t.classList.toggle('active', i === index));
        }

        showSlide(0);

        document.getElementById('slide-prev').addEventListener('click', () => showSlide(currentSlide - 1));
        document.getElementById('slide-next').addEventListener('click', () => showSlide(currentSlide + 1));
        document.getElementById('slide-fullscreen').addEventListener('click', () => {
          const viewer = document.getElementById('slide-viewer');
          if (viewer.requestFullscreen) viewer.requestFullscreen();
        });

        thumbs.forEach(thumb => {
          thumb.addEventListener('click', () => showSlide(parseInt(thumb.dataset.index)));
        });
      }

      if (window.initScrollAnimations) window.initScrollAnimations();
    }

    if (window.MemberAPI) {
      loadEvent();
    } else {
      window.addEventListener('memberapi-ready', loadEvent, { once: true });
    }
  })();
  </script>

<button id="orb" class="orb" aria-label="Open Synapse AI agent" onclick="toggle()">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.5"/><path d="M12 8v4"/><path d="M12 14h.01"/><circle cx="12" cy="17" r="2.5"/><circle cx="5" cy="12" r="2.5"/><circle cx="19" cy="12" r="2.5"/></svg>
</button>
<div id="agent-panel" role="dialog" aria-label="Synapse AI chat">
  <div class="ap-head">
    <span class="ap-name"><span class="dot"></span> Synapse AI</span>
    <button class="ap-close" onclick="toggle()" aria-label="Close">&times;</button>
  </div>
  <div class="ap-body" id="agent-messages">
    <div class="ap-msg agent">Hi, I am Synapse — the club's AI assistant. Ask me anything about workshops, events, membership, or the community.</div>
  </div>
  <form class="ap-inp" id="agent-form" onsubmit="return ask(event)">
    <input type="text" id="agent-input" placeholder="Ask Synapse anything…" autocomplete="off">
    <button type="submit" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
  </form>
</div>
