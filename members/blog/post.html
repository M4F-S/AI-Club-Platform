<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Post — 42 Berlin AI Club</title>
    <link rel="stylesheet" href="/members/members.css?v=6">
    <link rel="stylesheet" href="/assets/new-design-system.css?v=23">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#060612">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <style>
    .post-content { color: var(--muted); font-size: 16px; line-height: 1.7; white-space: pre-wrap; }
    .post-meta { font-size: 13px; color: var(--muted); margin: 0 0 18px; }
    .back-link { display: inline-block; margin-bottom: 18px; color: var(--muted);
      text-decoration: none; font-size: 14px; }
    .back-link:hover { color: var(--mint, #4DE3C1); }
  </style>
</head>
<body>
<a href="#main" class="skip-link">Skip to main content</a>
  <header class="member-header">
    <div class="container member-header-inner">
      <a href="/members/index.html" class="logo" aria-label="Dashboard">
        <img src="/assets/logo-gate.png" alt="42 Berlin AI Club" style="height:32px;width:auto;border-radius:8px;">
        <span style="margin-left:10px;font-family:var(--font-d);font-size:18px;letter-spacing:-.02em;color:var(--text)">42 Berlin AI Club</span>
      </a>
      <div class="user-menu">
        <span class="user-name" id="user-name">Loading...</span>
        <button class="logout-btn" id="logout-btn">Log out</button>
      </div>
    </div>
  </header>

<div class="container member-layout">
    <aside class="member-nav"></aside>
    <main id="main" class="member-main">

      <a class="back-link" href="index.html">&larr; Back to blog</a>
      <article class="card">
        <h1 id="post-title" class="page-title">Loading...</h1>
        <p class="post-meta" id="post-meta"></p>
        <div id="post-content" class="post-content"></div>
      </article>

    </main>
</div>

<script src="/assets/lucide.1.33.0.min.js"></script>
<script src="/members/members.js?v=4"></script>
<script>
  (function () {
    function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t == null ? '' : t; return d.innerHTML; }
    async function loadPost() {
      const { api } = window.MemberAPI;
      const title = document.getElementById('post-title');
      const slug = new URLSearchParams(location.search).get('slug');
      if (!slug) { title.textContent = 'Post not found'; return; }
      const res = await api('/posts/' + encodeURIComponent(slug));
      if (!res.ok) { title.textContent = 'Post not found'; return; }
      const p = res.data;
      title.textContent = p.title;
      document.getElementById('post-meta').textContent =
        new Date(p.created_at).toLocaleDateString() + ' · ' + (p.author || '42 Berlin AI Club');
      document.getElementById('post-content').textContent = p.content || '';
      document.title = p.title + ' — 42 Berlin AI Club';
    }
    if (window.MemberAPI) loadPost();
    else window.addEventListener('memberapi-ready', loadPost, { once: true });
  })();
</script>

</body>
</html>
