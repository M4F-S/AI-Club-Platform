<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club Blog — 42 Berlin AI Club</title>
    <link rel="stylesheet" href="/members/members.css?v=6">
    <link rel="stylesheet" href="/assets/new-design-system.css?v=23">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#060612">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <style>
    .post-list { display: grid; gap: 16px; margin-top: 8px; }
    .post-item { display: block; text-decoration: none; color: inherit;
      background: var(--surface, rgba(255,255,255,.04));
      border: 1px solid var(--border, rgba(255,255,255,.09));
      border-radius: 20px; padding: 22px 24px;
      transition: border-color .2s ease, transform .2s ease; }
    .post-item:hover { border-color: var(--mint, #4DE3C1); transform: translateY(-2px); }
    .post-item h3 { font-family: var(--font-d); font-size: 20px; line-height: 1.3;
      margin: 0 0 8px; color: var(--text); }
    .post-item .meta { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    .post-item p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.55; }
    .post-content { color: var(--muted); font-size: 16px; line-height: 1.7; white-space: pre-wrap; }
  </style>
</head>
<body>
<a href="#main" class="skip-link">Skip to main content</a>
  <header class="member-header">
    <div class="container member-header-inner">
      <a href="/members/index.html" class="logo" aria-label="Dashboard">
        <img src="/assets/logo-gate.png" alt="42 Berlin AI Club" style="height:32px;width:auto;border-radius:8px;">
        <span style="margin-left:10px;font-family:var(--font-d);font-size:18px;letter-spacing:-.02em;color:var(--text)">42 Berlin AI Club</span>
      </a>
      <div class="user-menu">
        <span class="user-name" id="user-name">Loading...</span>
        <button class="logout-btn" id="logout-btn">Log out</button>
      </div>
    </div>
  </header>

<div class="container member-layout">
    <aside class="member-nav"></aside>
    <main id="main" class="member-main">

      <h1 class="page-title animate-on-scroll">Club Blog</h1>
      <p class="page-subtitle animate-on-scroll">Updates, project highlights, and member writings.</p>
      <div id="posts-list"><p class="loading-text">Loading posts...</p></div>

    </main>
</div>

<script src="/assets/lucide.1.33.0.min.js"></script>
<script src="/members/members.js?v=4"></script>
<script>
  (function () {
    function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t == null ? '' : t; return d.innerHTML; }
    async function loadPosts() {
      const { api } = window.MemberAPI;
      const list = document.getElementById('posts-list');
      const res = await api('/posts');
      if (!res.ok || !res.data.length) {
        list.innerHTML = '<div class="card"><p>No blog posts yet — check back soon.</p></div>';
        return;
      }
      list.innerHTML = '<div class="post-list">' + res.data.map(function (p) {
        const summary = p.summary || (p.content || '').slice(0, 150);
        return '<a class="post-item" href="post.html?slug=' + encodeURIComponent(p.slug) + '">'
          + '<h3>' + escapeHtml(p.title) + '</h3>'
          + '<div class="meta">' + new Date(p.created_at).toLocaleDateString() + ' · ' + escapeHtml(p.author || '42 Berlin AI Club') + '</div>'
          + '<p>' + escapeHtml(summary) + '</p></a>';
      }).join('') + '</div>';
      if (window.initScrollAnimations) window.initScrollAnimations();
    }
    if (window.MemberAPI) loadPosts();
    else window.addEventListener('memberapi-ready', loadPosts, { once: true });
  })();
</script>

</body>
</html>
