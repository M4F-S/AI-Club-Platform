<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workshops & Events — 42 Berlin AI Club</title>
    <link rel="stylesheet" href="/assets/new-design-system.css?v=15">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#060612">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  
  
  
  
  
</head>
<body>
  <header class="member-header">
    <div class="container member-header-inner">
      <a href="/members/index.html" class="logo" aria-label="Dashboard">
        <img src="/assets/logo-gate.png" alt="42 Berlin AI Club" style="height:32px;width:auto;border-radius:8px;">
        <span style="margin-left:10px;font-family:var(--font-d);font-size:18px;letter-spacing:-.02em;color:var(--text)">42 Berlin AI Club</span>
      </a>
      <div class="user-menu">
        <span class="user-name" id="user-name">Loading...</span>
        <button class="logout-btn" id="logout-btn">Log out</button>
      </div>
    </div>
  </header>

<div class="container member-layout">
    <nav class="member-nav"></nav>
    <main class="member-main">

      <h1 class="page-title animate-on-scroll">Workshops & Events</h1>
      <p class="page-subtitle animate-on-scroll">Workshops, talks, and meetups for club members.</p>
      <div id="events-list"><p class="loading-text">Loading workshops...</p></div>

<button id="orb" class="orb" aria-label="Open Synapse AI agent" onclick="toggle()">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.5"/><path d="M12 8v4"/><path d="M12 14h.01"/><circle cx="12" cy="17" r="2.5"/><circle cx="5" cy="12" r="2.5"/><circle cx="19" cy="12" r="2.5"/></svg>
</button>
<div id="agent-panel" role="dialog" aria-label="Synapse AI chat">
  <div class="ap-head">
    <span class="ap-name"><span class="dot"></span> Synapse AI</span>
    <button class="ap-close" onclick="toggle()" aria-label="Close">&times;</button>
  </div>
  <div class="ap-body" id="agent-messages">
    <div class="ap-msg agent">Hi, I am Synapse — the club's AI assistant. Ask me anything about workshops, events, membership, or the community.</div>
  </div>
  <form class="ap-inp" id="agent-form" onsubmit="return ask(event)">
    <input type="text" id="agent-input" placeholder="Ask Synapse anything…" autocomplete="off">
    <button type="submit" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
  </form>
</div>
<script src="/assets/site.js?v=1"></script>
<script>      (function() {
        function escapeHtml(t) { const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
        
        async function loadEvents() {
          const list = document.getElementById('events-list');
          if (!window.MemberAPI) {
            list.innerHTML = '<div class="card"><p style="color:#e74c3c">Error: MemberAPI not loaded. Please refresh.</p></div>';
            return;
          }
          const { api } = window.MemberAPI;
          const res = await api('/events');
          if (!res.ok) {
            list.innerHTML = '<div class="card"><p style="color:#e74c3c">Failed to load workshops. <button onclick="loadEvents()" style="background:none;border:none;color:#ff6b8a;text-decoration:underline;cursor:pointer;">Retry</button></p></div>';
            return;
          }
          if (!res.data || !res.data.length) {
            list.innerHTML = '<div class="card"><p>No workshops scheduled yet.</p></div>';
            return;
          }
          list.innerHTML = res.data.map((e, i) => `
            <div class="card animate-on-scroll stagger-${Math.min(i % 4 + 1, 4)}">
              <h2><a href="event.html?id=${e.id}" style="text-decoration: none; color: inherit;">${escapeHtml(e.title)}</a></h2>
              <p class="meta">${e.event_date ? new Date(e.event_date).toLocaleString() : 'Date TBD'} ${e.location ? '· ' + escapeHtml(e.location) : ''}</p>
              <p>${escapeHtml(e.description || '')}</p>
              <div style="margin-top: 12px;">
                <a href="event.html?id=${e.id}" class="btn btn-primary">View workshop →</a>
                ${e.link ? `<a href="${escapeHtml(e.link)}" target="_blank" rel="noopener" class="btn btn-secondary" style="margin-left: 8px;">RSVP</a>` : ''}
              </div>
            </div>
          `).join('');
          // Re-init scroll animations for new content
          if (window.initScrollAnimations) window.initScrollAnimations();
        }
        
        // Wait for MemberAPI to be ready regardless of script order
        if (window.MemberAPI) {
          loadEvents();
        } else {
          window.addEventListener('memberapi-ready', loadEvents, { once: true });
        }
      })();
      </script>
<script src="/assets/lucide.1.33.0.min.js"></script>
    <script src="/members/members.js?v=3"></script>

</body>
</html>
